
name: Generate Pink Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Pink Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: YanniMaia
          outputs: |
            dist/github-contribution-grid-snake-pink.svg?color_snake=%23EC407A&color_dots=%23FCE4EC,%23F8BBD0,%23F48FB1,%23EC407A,%23C2185B

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

